name: Deploy HABDANA Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check Worker files
        run: |
          echo "=== Worker directory ==="
          ls -la worker
          echo "=== wrangler.toml ==="
          cat worker/wrangler.toml
          echo "=== worker.js exists ==="
          test -f worker/worker.js

      - name: Upload Groq Secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --name habdana-api

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy ./worker.js --name habdana-api --config ./wrangler.toml
