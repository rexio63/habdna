name: Deploy HABDANA to GitHub Pages

# ينشر الموقع الثابت (index.html / style.css / script.js / config.js) على GitHub Pages.
# ملاحظة: يمكن أيضًا تفعيل GitHub Pages مباشرة من إعدادات المستودع
# (Settings → Pages → Deploy from a branch) بدون الحاجة لهذا الملف إطلاقًا.
# هذا الـ workflow اختياري ويُستخدم لمن يفضّل نشرًا آليًا عبر Actions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
